global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lingo-ai-monitor'

scrape_configs:
  # FastAPI Backend Service
  - job_name: 'lingo-backend'
    static_configs:
      - targets: ['service:8000']
    metrics_path: '/metrics/'
    scrape_interval: 5s
    scrape_timeout: 5s

  # Next.js Frontend Service  
  - job_name: 'lingo-frontend'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
