services:
  nextjs:
    container_name: app
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app/.env
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    restart: unless-stopped

  fastapi:
    container_name: service
    build:
      context: ./service
      dockerfile: Dockerfile
    env_file:
      - ./service/.env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    container_name: lingo-redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
