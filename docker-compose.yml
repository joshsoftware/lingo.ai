services:
  lingo-ui:
    container_name: lingo-ui
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app/.env
    ports:
      - "3000:3000"
    networks:
      - lingo_network

    depends_on:
      - fastapi
        #- postgres

  lingo-ai:
    container_name: lingo-ai
    build:
      context: ./service
      dockerfile: Dockerfile
    env_file:
      - ./service/.env
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    networks:
      - lingo_network
    volumes:
      - ./service:/lingo/service
  postgres-lingo-db:
    container_name: postgres-lingo-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER_FILE:  /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    ports:
     - "5432:5432"
    networks:
      - lingo_network
    volumes:
    - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_user
      - db_name
      - db_password

  ollama:
    container_name: ollama
    image: ollama/ollama:0.6.6
    restart: always
    ports:
      - "11434:11434"
    networks:
      - lingo_network
    volumes:
      - ollama_data:/root/.ollama

secrets:
  db_user:
    file: ./secrets/pg/db_user.txt
  db_name:
    file: ./secrets/pg/db_name.txt
  db_password:
    file: ./secrets/pg/db_password.txt

networks:
  lingo_network:
    name: lingo_network
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
