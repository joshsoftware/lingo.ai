services:
  nextjs:
    container_name: app
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app/.env
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - lingo-network

  fastapi:
    container_name: service
    build:
      context: ./service
      dockerfile: Dockerfile
    env_file:
      - ./service/.env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - lingo-network

  redis:
    container_name: lingo-redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lingo-network

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - lingo-network

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lingo-network

networks:
  lingo-network:
    driver: bridge

volumes:
  prometheus-storage:
  grafana-storage:
